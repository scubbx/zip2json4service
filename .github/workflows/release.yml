name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v0.1.0"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux

          rm -rf build package dist
          mkdir -p build package dist

          build_target() {
            goos="$1"
            goarch="$2"
            ext="$3"
            archive="$4"

            binary="umap-geojson-proxy${ext}"
            artifact_base="umap-geojson-proxy_${VERSION}_${goos}_${goarch}"
            package_dir="package/${artifact_base}"

            echo "Building ${artifact_base}"

            mkdir -p "${package_dir}"

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "build/${binary}" \
              .

            cp "build/${binary}" "${package_dir}/${binary}"

            if [ -f README.md ]; then
              cp README.md "${package_dir}/README.md"
            fi

            if [ -f LICENSE ]; then
              cp LICENSE "${package_dir}/LICENSE"
            fi

            if [ "${archive}" = "zip" ]; then
              (
                cd package
                zip -r "../dist/${artifact_base}.zip" "${artifact_base}"
              )
            else
              tar -C package -czf "dist/${artifact_base}.tar.gz" "${artifact_base}"
            fi

            rm -rf "${package_dir}"
            rm -f "build/${binary}"
          }

          build_target linux amd64 "" tar.gz
          build_target linux arm64 "" tar.gz
          build_target darwin amd64 "" tar.gz
          build_target darwin arm64 "" tar.gz
          build_target windows amd64 ".exe" zip

          cd dist
          sha256sum * > SHA256SUMS.txt

          echo "Release assets:"
          ls -lah

          echo "Archive contents:"
          for file in *.tar.gz; do
            echo "== ${file} =="
            tar -tzf "${file}"
          done

          for file in *.zip; do
            echo "== ${file} =="
            unzip -l "${file}"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eux

          args=(
            "$VERSION"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
          )

          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"