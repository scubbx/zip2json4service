name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v0.1.0"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
        run: |
          set -eux

          mkdir -p build dist package

          binary="umap-geojson-proxy${{ matrix.ext }}"
          artifact_base="umap-geojson-proxy_${VERSION}_${GOOS}_${GOARCH}"
          package_dir="package/${artifact_base}"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "build/${binary}" \
            .

          mkdir -p "${package_dir}"
          cp "build/${binary}" "${package_dir}/${binary}"

          if [ -f README.md ]; then
            cp README.md "${package_dir}/README.md"
          fi

          if [ -f LICENSE ]; then
            cp LICENSE "${package_dir}/LICENSE"
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd package
            zip -r "../dist/${artifact_base}.zip" "${artifact_base}"
            cd ..
          else
            tar -C package -czf "dist/${artifact_base}.tar.gz" "${artifact_base}"
          fi

          echo "Archive contents:"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            unzip -l "dist/${artifact_base}.zip"
          else
            tar -tzf "dist/${artifact_base}.tar.gz"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: umap-geojson-proxy-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -eux

          mkdir -p dist

          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" dist/
          done

          echo "Release assets:"
          find dist -type f -maxdepth 1 -print | sort

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eux

          args=(
            "$VERSION"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
          )

          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"